kind = "web"
previewPath = "/"
title = "Đề cương Sinh học 10 – HK2"
version = "1.0.0"
id = "artifacts/sinh-hoc-10"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21109

[services.development]
run = "pnpm --filter @workspace/sinh-hoc-10 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sinh-hoc-10", "run", "build" ]
publicDir = "artifacts/sinh-hoc-10/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21109"
BASE_PATH = "/"
