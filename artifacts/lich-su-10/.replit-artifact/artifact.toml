kind = "web"
previewPath = "/"
title = "Ôn tập Lịch sử & Sinh học 10"
version = "1.0.0"
id = "artifacts/lich-su-10"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21087

[services.development]
run = "pnpm --filter @workspace/lich-su-10 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lich-su-10", "run", "build" ]
publicDir = "artifacts/lich-su-10/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21087"
BASE_PATH = "/"
